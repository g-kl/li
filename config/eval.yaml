defaults:
  - _self_
  - data: mouse

run_name: ???
ckpt: runs/${run_name}  # a run dir, or ${data.root}/model (paper weights), or an old coupling .pkl
fill: sampler  # sampler, posterior_mean, mean_pool, random_descendant, random_cell, modal_descendant
scramble: false  # permute leaf cells within each tree first (control)
n_samples: 4
device: cuda

hydra:
  run:
    dir: runs/${run_name}
  sweep:
    dir: runs
    subdir: ${run_name}
  output_subdir: null  # keep the training .hydra/
  job:
    chdir: false
